name: Flask CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout кода
        uses: actions/checkout@v3

      - name: Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12.3

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Проверка наличия app.py
        run: |
          if [ ! -f app.py ]; then echo "app.py не найден!"; exit 1; fi

      - name: Тестирование (если есть tests/)
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest
          else
            echo "Папка tests не найдена, пропускаем тесты"
          fi

      - name: Проверка синтаксиса Python
        run: |
          python -m py_compile app.py

  # Для Codespaces убираем deploy на внешний сервер
  # Приложение будет запускаться прямо в Codespace
  
  codespace-ready:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    
    steps:
      - name: Приложение готово к запуску в Codespace
        run: |
          echo "✅ Тесты прошли успешно!"
          echo "🚀 Приложение готово к запуску в GitHub Codespace"
          echo "📝 Для запуска в Codespace выполните: python app.py"