name: Flask CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout кода
        uses: actions/checkout@v3

      - name: Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12.3

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Проверка наличия app.py
        run: |
          if [ ! -f app.py ]; then echo "app.py не найден!"; exit 1; fi

      - name: Тестирование (если есть tests/)
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest
          else
            echo "Папка tests не найдена"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Деплой на сервер через SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 192.168.0.103
          username: your_username
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/poekt/kursach-master
            git pull origin master
            source venv/bin/activate
            pip install -r requirements.txt
            systemctl restart flaskapp  # если у тебя настроен systemd
