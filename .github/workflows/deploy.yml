name: Flask CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name:  Клонируем репозиторий
      uses: actions/checkoutv3

    - name:  Устанавливаем Python
      uses: actions/setup-pythonv4
      with:
        python-version: 3.10

    - name:  Устанавливаем зависимости
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name:  Проверка на наличие app.py
      run: |
        if [ ! -f app.py ]; then echo " app.py не найден!"; exit 1; fi
        echo " app.py найден."

    - name:  (опционально) Запуск тестов
      run: |
        if [ -d tests ]; then
          echo " Папка tests найдена. Запускаем pytest"
          pip install pytest
          pytest
        else
          echo " Папка tests не найдена. Пропускаем."
        fi

