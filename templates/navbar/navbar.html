<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>


<!-- navbar.html -->
<header class="navbar">
    <div class="navbar-left">
        <div class="logo-group">
            <div class="app-logo">
                <i class="fas fa-clipboard-list"></i>
                <span>LMS Система</span>
            </div>
        </div>
        
        <nav class="main-nav">
            <a href="{{ url_for('kanban.kanban_board') }}" class="nav-link {% if active_page == 'kanban' %}active{% endif %}" id="kanban-link">
                <i class="fas fa-clipboard-list"></i>
                <span>Kanban</span>
            </a>
            <a href="{{ url_for('documents.documents') }}" class="nav-link {% if active_page == 'documents' %}active{% endif %}">
                <i class="fas fa-file-alt"></i>
                <span>Документы</span>
            </a>
            <a href="{{ url_for('chat.messenger_page') }}" class="nav-link {% if active_page == 'chat' %}active{% endif %}">
                <i class="fas fa-comment"></i>
                <span>Чаты</span>
            </a>
            <a href="{{url_for('reports.reports_dashboard')}}" class="nav-link {% if active_page == 'reports' %}active{% endif %}">
                <i class="fas fa-chart-bar"></i>
                <span>Отчетность</span>
            </a>
            <a href="{{ url_for('kpi.kpi_constructor') }}" class="nav-link {% if active_page == 'kpi' %}active{% endif %}" id="kpi-link">
                <i class="fas fa-chart-line"></i>
                <span>KPI</span>
            </a>
            <a href="{{ url_for('calendar.calendar_page') }}" class="nav-link {% if active_page == 'calendar' or active_page == 'zoom' %}active{% endif %}" id="zoom-link">
                <i class="fas fa-video"></i>
                <span>Zoom</span>
            </a>
        </nav>
    </div>
    
    <div class="navbar-right">
        {% if 'admin' in current_user.roles|map(attribute='name')|list %}
        <div class="admin-badge nav-link" onclick="location.href='{{ url_for('admin.user_management') }}'">
            <i class="fas fa-shield-alt"></i>
            <strong>{{ current_user.username }}</strong>
        </div>
        {% endif %}
        
        <div class="position-relative notification-bell-container">
            <button class="btn btn-link text-decoration-none position-relative" 
                    id="notificationBell" 
                    data-bs-toggle="dropdown" 
                    aria-expanded="false">
                <i class="bi bi-bell fs-5"></i>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger notification-badge" 
                      id="notificationCount" 
                      style="font-size: 0.6rem; display: none;">
                    0
                </span>
            </button>
            
            <div class="dropdown-menu dropdown-menu-end notification-dropdown py-0">
                <div class="py-2 px-3 bg-light border-bottom d-flex justify-content-between align-items-center">
                    <strong>Уведомления</strong>
                    <button class="btn btn-sm text-primary mark-all-read" id="markAllNotificationsAsRead">Отметить все как прочитанные</button>
                </div>
                <div id="notificationDropdownContent" class="notification-dropdown-content" style="max-height: 300px; overflow-y: auto; min-width: 300px;">
                    <div class="text-center p-3" id="notificationLoader">
                        <div class="spinner-border spinner-border-sm text-secondary" role="status">
                            <span class="visually-hidden">Загрузка...</span>
                        </div>
                    </div>
                    <!-- Здесь будут отображаться уведомления -->
                </div>
                <div class="py-2 text-center border-top">
                    <a href="{{ url_for('notifications.notifications_page') }}" class="text-decoration-none">Просмотреть все уведомления</a>
                </div>
            </div>
        </div>
        
        <!-- Кнопка профиля пользователя с аватаром -->
        <div class="position-relative user-profile-container mx-2">
            <button class="btn btn-link text-decoration-none position-relative user-avatar-btn" 
                    onclick="location.href='{{ url_for('profile.profile_page') }}'">
                {% if current_user.avatar %}
                    <img src="{{ current_user.avatar }}" alt="{{ current_user.username }}" class="user-avatar">
                {% else %}
                    <div class="user-avatar-placeholder">{{ current_user.username[0]|upper }}</div>
                {% endif %}
            </button>
        </div>
        
        <a href="{{ url_for('auth.logout') }}" class="nav-link desktop-only logout-link">
            <i class="fas fa-sign-out-alt"></i>
            <span>Выход</span>
        </a>
    </div>
    
    <button class="mobile-menu-button" id="mobileMenuButton">
        <i class="fas fa-bars"></i>
    </button>
</header>

<!-- Глобальный JavaScript для всех страниц -->
<script src="{{ url_for('static', filename='js/global.js') }}"></script>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<script>
    window.appConfig = {
        currentUserId: "{{ current_user.id if current_user.is_authenticated else '' }}",
        currentPath: "{{ request.path }}"
    };
</script>

<script src="{{ url_for('static', filename='js/navbar.js') }}"></script>
