<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trash - Document Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .trash-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        .trash-info {
            flex-grow: 1;
        }
        .days-left {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Trash</h2>
            <div>
                <a href="{{ url_for('documents.documents') }}" class="btn btn-secondary me-2">
                    <i class="fas fa-arrow-left"></i> Back to Documents
                </a>
                {% if files %}
                <a href="{{ url_for('trash.empty_trash') }}" 
                   class="btn btn-danger"
                   onclick="return confirm('Are you sure you want to permanently delete all files?');">
                    <i class="fas fa-trash"></i> Empty Trash
                </a>
                {% endif %}
            </div>
        </div>

        {% if files %}
            <div class="card">
                <div class="card-body">
                    {% for file in files %}
                        <div class="trash-item">
                            <div class="trash-info">
                                <h5 class="mb-1">{{ file.name }}</h5>
                                <small class="text-muted">Deleted: {{ file.deleted_at }}</small>
                                <br>
                                <small class="days-left">Will be permanently deleted in {{ file.days_left }} days</small>
                            </div>
                            <div class="actions">
                                <a href="{{ url_for('trash.restore_from_trash', filename=file.name) }}" 
                                   class="btn btn-success btn-sm me-2">
                                    <i class="fas fa-undo"></i> Restore
                                </a>
                                <a href="{{ url_for('trash.delete_from_trash', filename=file.name) }}" 
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Are you sure you want to permanently delete this file?');">
                                    <i class="fas fa-trash"></i> Delete Permanently
                                </a>
                            </div>
                        </div>
                    {% endfor %}
                </div>
            </div>
        {% else %}
            <div class="alert alert-info">
                Trash is empty
            </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
