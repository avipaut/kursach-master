<!-- recordings.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Recordings Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
          /* Color variables */
          --primary-color: #C71320;
          --primary-hover: #4338ca;
          --danger-color: #ef4444;
          --danger-hover: #dc2626;
          --success-color: #10b981;
          --success-hover: #059669;
          --bg-color: #f5f5f5;
          --card-bg: #ffffff;
          --border-color: #e5e7eb;
          --text-primary: #111827;
          --text-secondary: #4b5563;
          --text-muted: #6b7280;
        }
        
        /* Custom styles for the recording cards */
        .recording-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .recording-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        .recording-date {
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        
        .recording-duration {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        
        .recording-size {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        
        .btn-watch {
            background-color: var(--primary-color);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        
        .btn-watch:hover {
            background-color: #a51019;
        }
        
        .btn-download {
            background-color: #2196F3;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        
        .btn-download:hover {
            background-color: #1976D2;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col">
    {% include 'navbar.html' %}

    <!-- Page Content Container -->
    <div class="flex-1 flex flex-col overflow-hidden" id="page-content">
        <!-- Recordings Archive Page -->
        <div id="recordings-page" class="flex-1 flex flex-col">
            <!-- Subheader -->
            <div class="bg-white p-4 flex justify-between items-center border-b">
                <div class="flex items-center">
                    <i class="fas fa-video text-red-500 text-xl mr-2"></i>
                    <h2 class="text-xl font-bold">Zoom Recordings Archive</h2>
                </div>
                <div class="flex space-x-2">
                    <a href="{{ url_for('calendar.calendar_page') }}" class="flex items-center bg-white border border-red-500 text-red-500 rounded-md px-4 py-2 hover:bg-red-50">
                        <i class="fas fa-calendar mr-2"></i> Back to Calendar
                    </a>
                </div>
            </div>

            <!-- Date Range Filter -->
            <div class="bg-white p-4 border-b">
                <form id="date-filter-form" class="flex flex-wrap gap-4 items-end">
                    <div>
                        <label for="from-date" class="block text-sm font-medium text-gray-700 mb-1">From Date</label>
                        <input type="date" id="from-date" class="rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>
                    <div>
                        <label for="to-date" class="block text-sm font-medium text-gray-700 mb-1">To Date</label>
                        <input type="date" id="to-date" class="rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>
                    <div>
                        <button type="submit" class="bg-blue-500 text-white rounded-md px-4 py-2 hover:bg-blue-600">
                            <i class="fas fa-search mr-2"></i> Filter
                        </button>
                    </div>
                </form>
            </div>

            <!-- Recordings Container -->
            <div class="flex-1 overflow-auto p-4">
                <div id="recordings-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Recording cards will be populated via JavaScript -->
                    <div id="loading-indicator" class="col-span-full text-center py-8 text-gray-500">
                        <i class="fas fa-spinner fa-spin text-2xl mr-2"></i>
                        Loading recordings...
                    </div>
                </div>
                
                <!-- No recordings message -->
                <div id="no-recordings-message" class="hidden text-center py-12">
                    <div class="bg-white rounded-lg shadow p-8 max-w-lg mx-auto">
                        <div class="text-gray-400 mb-4">
                            <i class="fas fa-video-slash text-5xl"></i>
                        </div>
                        <h3 class="text-xl font-semibold text-gray-700 mb-2">No Recordings Found</h3>
                        <p class="text-gray-500">There are no recordings available for the selected date range.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Set default date range (last 30 days)
            const today = new Date();
            const thirtyDaysAgo = new Date(today);
            thirtyDaysAgo.setDate(today.getDate() - 30);
            
            document.getElementById('from-date').value = formatDate(thirtyDaysAgo);
            document.getElementById('to-date').value = formatDate(today);
            
            // Load recordings with default date range
            loadRecordings();
            
            // Set up date filter form
            document.getElementById('date-filter-form').addEventListener('submit', function(e) {
                e.preventDefault();
                loadRecordings();
            });
        });
        
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        
        function loadRecordings() {
            const fromDate = document.getElementById('from-date').value;
            const toDate = document.getElementById('to-date').value;
            
            // Show loading indicator
            document.getElementById('loading-indicator').classList.remove('hidden');
            document.getElementById('no-recordings-message').classList.add('hidden');
            
            // Clear current recordings
            const recordingsList = document.getElementById('recordings-list');
            const loadingIndicator = document.getElementById('loading-indicator');
            
            // Keep the loading indicator but remove all other children
            while (recordingsList.children.length > 1) {
                recordingsList.removeChild(recordingsList.lastChild);
            }
            
            // Fetch recordings
            fetch(`/calendar/recordings?from=${fromDate}&to=${toDate}`)
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(errorData => {
                            throw new Error(errorData.error || 'Unknown error');
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    // Hide loading indicator
                    loadingIndicator.classList.add('hidden');
                    
                    // Process and display recordings
                    if (data.meetings && data.meetings.length > 0) {
                        displayRecordings(data.meetings);
                    } else {
                        document.getElementById('no-recordings-message').classList.remove('hidden');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    loadingIndicator.classList.add('hidden');
                    showToast(`Error loading recordings: ${error.message}`, true);
                });
        }
        
        function displayRecordings(meetings) {
            const recordingsList = document.getElementById('recordings-list');
            
            meetings.forEach(meeting => {
                if (!meeting.recording_files || meeting.recording_files.length === 0) {
                    return; // Skip meetings without recordings
                }
                
                // Find the main recording file (prefer MP4)
                const mainRecording = meeting.recording_files.find(file => file.file_type === 'MP4') || meeting.recording_files[0];
                
                // Format duration
                const durationMinutes = Math.floor(mainRecording.duration_minutes);
                const durationSeconds = Math.round((mainRecording.duration_minutes - durationMinutes) * 60);
                const formattedDuration = `${durationMinutes}:${durationSeconds.toString().padStart(2, '0')}`;
                
                // Format file size
                const fileSizeMB = (mainRecording.file_size / (1024 * 1024)).toFixed(2);
                
                // Format date
                const recordingDate = new Date(meeting.start_time);
                const formattedDate = recordingDate.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                // Create card element
                const card = document.createElement('div');
                card.className = 'recording-card bg-white rounded-lg shadow overflow-hidden';
                
                card.innerHTML = `
                    <div class="p-4">
                        <h3 class="text-lg font-semibold text-gray-800 mb-2">${meeting.topic}</h3>
                        <div class="flex justify-between items-center mb-3">
                            <span class="recording-date">${formattedDate}</span>
                            <span class="recording-duration">${formattedDuration}</span>
                        </div>
                        ${meeting.agenda ? `<p class="text-gray-600 mb-3 text-sm">${meeting.agenda}</p>` : ''}
                        <div class="flex justify-between items-center">
                            <span class="recording-size">${fileSizeMB} MB</span>
                            <div class="space-x-2">
                                <a href="${mainRecording.play_url}" target="_blank" class="btn-watch">
                                    <i class="fas fa-play mr-1"></i> Watch
                                </a>
                                <a href="${mainRecording.download_url}" target="_blank" class="btn-download">
                                    <i class="fas fa-download mr-1"></i> Download
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                
                recordingsList.appendChild(card);
            });
        }
        
        function showToast(message, isError = false) {
            Toastify({
                text: message,
                duration: 3000,
                gravity: "top",
                position: "right",
                style: {
                    background: isError ? "#EF4444" : "#10B981"
                }
            }).showToast();
        }
    </script>
</body>
</html>
