name: Flask CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔁 Клонирование репозитория
        uses: actions/checkout@v3

      - name: 🐍 Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12.3

      - name: 📦 Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Проверка наличия app.py
        run: |
          if [ ! -f app.py ]; then echo "❌ app.py не найден!"; exit 1; fi

      - name: ✅ Тестирование (если есть tests/)
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest
          else
            echo "ℹ️ Папка tests не найдена, пропускаем тесты"
          fi

      - name: 🧪 Проверка синтаксиса Python
        run: |
          python -m py_compile app.py

      - name: 🚀 Деплой на сервер
        if: github.ref == 'refs/heads/master'
        run: |
          echo "$DEPLOY_KEY" > private_key
          chmod 600 private_key

          echo "📡 Копируем проект на сервер..."
          scp -i private_key -o StrictHostKeyChecking=no -r . $SSH_USER@$SSH_HOST:/home/$SSH_USER/app

          echo "⚙️ Подключаемся и выполняем команды на сервере..."
          ssh -i private_key -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << 'EOF'
            cd ~/app
            echo "📦 Установка зависимостей на сервере"
            python3 -m pip install --user -r requirements.txt

            echo "🔄 Перезапуск gunicorn (если используется)"
            pkill gunicorn || true
            nohup ~/.local/bin/gunicorn -w 4 -b 0.0.0.0:8000 app:app > server.log 2>&1 &
            echo "✅ Приложение перезапущено"
          EOF
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
