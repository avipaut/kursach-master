<!-- chat.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">    
    <title>CRM System - Chat</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
    <style>
        /* Base styling */
        :root {
          /* Priority colors */
          --priority-low-bg: #d1fae5;
          --priority-low-text: #065f46;
          --priority-medium-bg: #fef3c7;
          --priority-medium-text: #92400e;
          --priority-high-bg: #fee2e2;
          --priority-high-text: #b91c1c;
          
          /* Shadow variables */
          --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
          --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
          --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
          --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
          
          /* Brand colors */
          --pink-600: #C71320;
          --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        body {
          font-family: var(--font-sans);
          background-color: var(--bg-color);
          color: var(--text-primary);
          line-height: 1.5;
          height: 100vh;
          overflow: hidden;
          display: flex;
          flex-direction: column;
        }

        a {
          text-decoration: none;
          color: inherit;
        }

        /* Layout */
        .app-container {
          display: flex;
          flex: 1;
          overflow: hidden;
        }

        /* Стили для бейджа непрочитанных сообщений в навигационной панели */
        .unread-chat-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: var(--primary-color);
            color: white;
            font-size: 0.7rem;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        /* Стили для индикатора непрочитанных сообщений в списке контактов */
        .unread-count-badge {
            background-color: var(--primary-color);
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            min-width: 22px;
            height: 22px;
            border-radius: 11px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 6px;
            margin-left: 10px;
        }

        /* Выделяем контакты с непрочитанными сообщениями */
        .contact-item.has-unread {
            background-color: rgba(245, 75, 100, 0.05);
        }

        .contact-item.has-unread:hover {
            background-color: rgba(245, 75, 100, 0.1);
        }

        /* Стили для отображения имени контакта с непрочитанными сообщениями */
        .contact-item.has-unread .contact-name {
            font-weight: 600;
            color: var(--text-color);
        }

        /* Стили для последнего сообщения контакта с непрочитанными сообщениями */
        .contact-item.has-unread .contact-message {
            font-weight: 500;
            color: var(--text-color);
        }

        /* Стили для контейнера времени и статуса сообщения */
        .message-time-container {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Стили для индикатора статуса сообщения */
        .message-status {
            display: flex;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .message-sent {
            color: #a0a0a0;
        }

        .message-read {
            color: #4eb1ff;
        }

        /* Позиционирование двойной галочки */
        .second-check {
            margin-left: -3px;
        }

        /* Изменяем размещение контейнера со временем и статусом для выравнивания */
        .own-messages .message-time-container {
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    
    <!-- Include navbar with active page set to 'chat' -->
    {% set active_page = 'chat' %}
    {% include 'navbar.html' %}

    <div class="app-container">
        <!-- Contacts List -->
        <div class="contacts-container">
            <div class="contacts-header">
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input type="text" class="search-input" placeholder="Search users..." id="searchContacts">
                </div>
            </div>
            <div class="contacts-list" id="contactsList">
                <!-- Contact items will be populated by JavaScript -->
            </div>
            <div class="create-chat-btn" id="createChatBtn">
                <i class="fas fa-plus"></i>
            </div>
        </div>

        <!-- Chat Area (Initially shows empty state) -->
        <div class="chat-container" id="chatContainer">
            <div class="no-chat-selected" id="noChatSelected">
                <div class="no-chat-icon">
                    <i class="far fa-comment-alt"></i>
                </div>
                <h3 class="no-chat-title">Your Messages</h3>
                <p class="no-chat-subtitle">Select a conversation or start a new one by clicking on a user.</p>
            </div>
            
            <!-- This will be shown when a chat is selected -->
            <div class="active-chat" id="activeChat" style="display: none;">
                <div class="chat-header">
                    <div class="chat-user-info" id="chatUserInfo">
                        <div class="avatar">
                            <span class="avatar-text" id="chatAvatarText"></span>
                            <img id="chatAvatarImg" style="display: none;">
                            <span class="status-indicator" id="chatStatusIndicator"></span>
                        </div>
                        <div>
                            <div class="contact-name" id="chatName"></div>
                            <div class="chat-user-status" id="chatStatus"></div>
                        </div>
                    </div>
                    <div class="chat-header-actions d-none d-md-flex"> <!-- Скрыто на мобильных, показано на больших экранах -->
                        <button class="view-profile-btn" id="viewProfileBtn">
                            <i class="fas fa-user"></i>
                        </button>
                    </div>
                    
                    <div class="chat-header-actions d-flex d-md-none"> <!-- Показано на мобильных, скрыто на больших экранах -->
                        <button class="view-profile-btn" id="viewProfileBtn">
                            <i class="fas fa-user"></i>
                        </button>
                        <button class="mobile-chat-back" id="mobileChatBack">
                            <i class="fas fa-arrow-left"></i>
                        </button>
                    </div>
                </div>
                
                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will be populated by JavaScript -->
                </div>
                
                <div class="chat-typing" id="typingIndicator" style="display: none;">
                    <span id="typingUsername"></span> is typing
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
                
                <div id="attachmentPreview" style="display: none;" class="attachment-preview">
                    <!-- Attachment previews will be populated by JavaScript -->
                </div>
                
                <div class="chat-input-container">
                    <div class="chat-input-actions">
                        <div class="chat-input-btn" id="attachFile">
                            <i class="fas fa-paperclip"></i>
                        </div>
                        <input type="file" id="fileInput" style="display: none;" multiple>
                        
                        <div class="chat-input-btn" id="openEmoji">
                            <i class="far fa-smile"></i>
                        </div>
                    </div>
                    <div class="chat-input">
                        <textarea class="chat-input-field" id="messageInput" placeholder="Type a message..." rows="1"></textarea>
                        <div class="chat-send-btn" id="sendMessage">
                            <i class="fas fa-paper-plane"></i>
                        </div>
                    </div>
                    
                    <!-- Добавим панель эмодзи -->
                    <div class="emoji-picker" id="emojiPicker" style="display: none;">
                        <!-- Эмодзи будут загружены динамически -->
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Profile Panel (Hidden by default) -->
        <div class="profile-panel" id="profilePanel" style="display: none;">
            <div class="profile-header">
                <div class="profile-title">Profile</div>
                <div class="profile-close" id="closeProfile">
                    <i class="fas fa-times"></i>
                </div>
            </div>
            <div class="profile-content">
                <div class="profile-user">
                    <div class="profile-avatar">
                        <img id="profileAvatar" src="" alt="Profile Avatar">
                    </div>
                    <h3 class="profile-name" id="profileName"></h3>
                    <p class="profile-title" id="profileTitle"></p>
                    <span class="profile-status-badge profile-status-online" id="profileStatusBadge">Online</span>
                </div>
                
                <div class="profile-section">
                    <h4 class="profile-section-title">About</h4>
                    <p class="profile-about" id="profileAbout"></p>
                </div>
                
                <div class="profile-section">
                    <h4 class="profile-section-title">Contact Information</h4>
                    <div class="profile-info-item">
                        <i class="fas fa-envelope profile-info-icon"></i>
                        <span id="profileEmail"></span>
                    </div>
                    <div class="profile-info-item">
                        <i class="fas fa-user profile-info-icon"></i>
                        <span id="profileUsername"></span>
                    </div>
                </div>
                
                <div class="profile-section">
                    <h4 class="profile-section-title">Shared Files</h4>
                    <div class="shared-files" id="sharedFiles">
                        <!-- File items will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Group Chat Modal -->
    <div class="modal fade" id="createGroupModal" tabindex="-1" role="dialog" aria-labelledby="createGroupModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createGroupModalLabel">Create Group Chat</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="groupName" class="form-label">Group Name</label>
                        <input type="text" class="form-control" id="groupName" placeholder="Enter group name">
                    </div>
                    <div class="mb-3">
                        <label for="groupDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="groupDescription" placeholder="Enter group description" rows="2"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Add Participants</label>
                        <div class="participants-list" id="participantsList">
                            <!-- Participants will be populated by JavaScript -->
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="createGroupBtn">Create Group</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно для просмотра изображений -->
    <div id="imageModal" class="image-modal" style="display: none;">
        <div class="image-modal-content">
            <img id="modalImage" alt="Full size image">
        </div>
        <div class="image-modal-close">&times;</div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Socket.IO client -->
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>

    <script>
        // Получение общего количества непрочитанных сообщений для обновления индикатора в навбаре
        function updateUnreadMessagesTotal() {
            fetch('/chat/api/unread_messages_total')
                .then(response => response.json())
                .then(data => {
                    // Обновляем индикатор в навигационной панели
                    const navChatLink = document.querySelector('a.nav-link[href*="chat"]');
                    if (navChatLink) {
                        // Находим или создаем бейдж для непрочитанных сообщений
                        let unreadBadge = navChatLink.querySelector('.unread-chat-badge');
                        
                        if (data.unread_count > 0) {
                            if (!unreadBadge) {
                                unreadBadge = document.createElement('span');
                                unreadBadge.className = 'unread-chat-badge';
                                navChatLink.appendChild(unreadBadge);
                            }
                            // Обновляем содержимое бейджа
                            unreadBadge.textContent = data.unread_count > 99 ? '99+' : data.unread_count;
                        } else if (unreadBadge) {
                            unreadBadge.remove();
                        }
                    }
                })
                .catch(error => {
                    console.error('Error fetching unread messages count:', error);
                });
        }

        // Обновление списка лобби с количеством непрочитанных сообщений
        function updateLobbiesWithUnread() {
            fetch('/chat/api/lobbies_with_unread')
                .then(response => response.json())
                .then(lobbiesWithUnread => {
                    // Создаем карту лобби с непрочитанными сообщениями для быстрого доступа
                    const unreadCountMap = new Map();
                    lobbiesWithUnread.forEach(item => {
                        unreadCountMap.set(item.lobby_id, item.unread_count);
                    });
                    
                    // Обновляем индикаторы непрочитанных сообщений для каждого контакта
                    document.querySelectorAll('.contact-item[data-lobby-id]').forEach(contactItem => {
                        const lobbyId = parseInt(contactItem.dataset.lobbyId);
                        if (!lobbyId) return;
                        
                        // Находим или создаем бейдж для непрочитанных сообщений
                        let unreadBadge = contactItem.querySelector('.unread-count-badge');
                        
                        if (unreadCountMap.has(lobbyId)) {
                            const unreadCount = unreadCountMap.get(lobbyId);
                            
                            if (!unreadBadge) {
                                unreadBadge = document.createElement('div');
                                unreadBadge.className = 'unread-count-badge';
                                contactItem.querySelector('.contact-info').appendChild(unreadBadge);
                            }
                            
                            unreadBadge.textContent = unreadCount > 99 ? '99+' : unreadCount;
                            // Выделяем контакт с непрочитанными сообщениями
                            contactItem.classList.add('has-unread');
                        } else if (unreadBadge) {
                            unreadBadge.remove();
                            contactItem.classList.remove('has-unread');
                        }
                    });
                })
                .catch(error => {
                    console.error('Error fetching lobbies with unread messages:', error);
                });
        }

        // Вызываем функции обновления при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            // Инициализация при загрузке DOM
            updateUnreadMessagesTotal();
            updateLobbiesWithUnread();
            
            // Устанавливаем интервал обновления
            setInterval(() => {
                updateUnreadMessagesTotal();
                updateLobbiesWithUnread();
            }, 60000); // Каждую минуту
        });
    </script>
    
    {% if initial_lobby_id is defined and initial_lobby_id %}
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Когда DOM загружен и лобби загружены, выбираем начальное лобби
            const checkLobbiesInterval = setInterval(function() {
                if (typeof lobbiesList !== 'undefined' && lobbiesList.length > 0) {
                    clearInterval(checkLobbiesInterval);
                    
                    // Проверяем, существует ли указанное лобби
                    const lobbyExists = lobbiesList.some(lobby => lobby.id == {{ initial_lobby_id }});
                    
                    if (lobbyExists) {
                        selectLobby({{ initial_lobby_id }});
                    }
                }
            }, 100);
        });
    </script>
    {% endif %}
</body>
</html>
