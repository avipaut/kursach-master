<!-- calendar.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar & Zoom Meetings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <style>
        :root {
          /* Color variables */
          --primary-color: #C71320;
          --primary-hover: #4338ca;
          --danger-color: #ef4444;
          --danger-hover: #dc2626;
          --success-color: #10b981;
          --success-hover: #059669;
          --bg-color: #f5f5f5;
          --card-bg: #ffffff;
          --border-color: #e5e7eb;
          --text-primary: #111827;
          --text-secondary: #4b5563;
          --text-muted: #6b7280;
        }

        /* Calendar event styling */
        .fc-event.zoom-event {
            background-color: #2196F3 !important;
            border-color: #1976D2 !important;
        }
        
        .fc-event.task-event {
            background-color: #3788d8 !important;
            border-color: #2c6fb7 !important;
        }
        
        .fc-event.personal-event {
            background-color: #9C27B0 !important;
            border-color: #7B1FA2 !important;
        }
        
        /* Badge styles */
        .badge-zoom {
            background-color: #2196F3;
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .badge-recording {
            background-color: #F44336;
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .badge-personal {
            background-color: #9C27B0;
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        /* Modal styles */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-content {
            background-color: white;
            border-radius: 0.5rem;
            padding: 1.5rem;
            width: 100%;
            max-width: 32rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        /* Select2 custom styling */
        .select2-container--default .select2-selection--multiple {
            border-color: #D1D5DB;
            border-radius: 0.375rem;
        }
        
        .select2-container--default.select2-container--focus .select2-selection--multiple {
            border-color: #2196F3;
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50 flex flex-col">
    {% include 'navbar.html' %}

    <!-- Page Content Container -->
    <div class="flex-1 flex flex-col overflow-hidden" id="page-content">
        <!-- Calendar View (default view) -->
        <div id="calendar-page" class="flex-1 flex flex-col">
            <!-- Subheader -->
            <div class="bg-white p-4 flex justify-between items-center border-b">
                <div class="flex items-center">
                    <i class="far fa-calendar text-red-500 text-xl mr-2"></i>
                    <h2 class="text-xl font-bold">Calendar</h2>
                </div>
                <div class="flex space-x-2">
                    <button onclick="toggleForm('task')" class="flex items-center bg-white border border-red-500 text-red-500 rounded-md px-4 py-2 hover:bg-red-50">
                        <i class="fas fa-plus mr-2"></i> New Task
                    </button>
                    {% if current_user.is_admin %}
                    <button onclick="toggleForm('zoom')" class="flex items-center bg-red-500 text-white rounded-md px-4 py-2 hover:bg-red-600">
                        <i class="fas fa-plus mr-2"></i> New Zoom Meeting
                    </button>
                    <a href="{{ url_for('calendar.recordings_archive') }}" class="flex items-center bg-blue-500 text-white rounded-md px-4 py-2 hover:bg-blue-600">
                        <i class="fas fa-video mr-2"></i> Recordings
                    </a>
                    {% endif %}
                </div>
            </div>

            <!-- Calendar Container -->
            <div class="flex-1 overflow-auto p-4">
                <!-- Calendar View Controls -->
                <div class="flex justify-between mb-4">
                    <div class="flex">
                        <button id="prev-button" class="bg-red-500 text-white px-3 py-2 rounded-l-md hover:bg-red-600">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button id="next-button" class="bg-red-500 text-white px-3 py-2 rounded-r-md hover:bg-red-600">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                        <button id="today-button" class="ml-2 bg-pink-100 text-red-500 px-4 py-2 rounded-md hover:bg-pink-200">
                            today
                        </button>
                    </div>
                    <h2 id="current-date-title" class="text-2xl font-bold">February 2025</h2>
                    <div class="flex">
                        <button id="month-view" class="bg-red-500 text-white px-4 py-2 rounded-l-md hover:bg-red-600">
                            month
                        </button>
                        <button id="week-view" class="bg-red-100 text-red-500 px-4 py-2 hover:bg-red-200">
                            week
                        </button>
                        <button id="day-view" class="bg-red-100 text-red-500 px-4 py-2 rounded-r-md hover:bg-red-200">
                            day
                        </button>
                    </div>
                </div>

                <!-- Calendar -->
                <div id="calendar" class="bg-white rounded-lg shadow"></div>
            </div>
        </div>
    </div>

    <!-- Task Form Modal -->
    <div id="task-form-container" class="modal-backdrop hidden">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold">Create Personal Task</h2>
                <button onclick="toggleForm('close')" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="task-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Title</label>
                    <input type="text" id="task-title" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Start Date</label>
                        <input type="date" id="task-start-date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Start Time</label>
                        <input type="time" id="task-start-time" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Description</label>
                    <textarea id="task-description" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Color</label>
                    <input type="color" id="task-color" value="#3788d8" class="mt-1 block rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="task-all-day" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <label for="task-all-day" class="ml-2 text-sm text-gray-700">All Day</label>
                </div>

                <button type="submit" class="w-full bg-red-500 text-white py-2 px-4 rounded-md hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                    Create Task
                </button>
            </form>
        </div>
    </div>

    <!-- Zoom Form Modal -->
    <div id="zoom-form-container" class="modal-backdrop hidden">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold">Create Zoom Meeting</h2>
                <button onclick="toggleForm('close')" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="zoom-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Meeting Topic</label>
                    <input type="text" id="zoom-topic" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Date</label>
                        <input type="date" id="zoom-start-date" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Time</label>
                        <input type="time" id="zoom-start-time" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Duration (minutes)</label>
                    <input type="number" id="zoom-duration" required min="15" step="15" value="60" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Agenda</label>
                    <textarea id="zoom-agenda" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Participants</label>
                    <select id="zoom-participants" multiple class="participants-select mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        <!-- Options will be populated via AJAX -->
                    </select>
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="zoom-auto-record" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <label for="zoom-auto-record" class="ml-2 text-sm text-gray-700">Auto-Record Meeting</label>
                </div>

                <button type="submit" class="w-full bg-red-500 text-white py-2 px-4 rounded-md hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                    Create Zoom Meeting
                </button>
            </form>
        </div>
    </div>

    <!-- Event Details Modal (will be created dynamically) -->
    <div id="event-modal-container" class="modal-backdrop hidden">
        <div class="modal-content" id="event-modal-content">
            <!-- Content will be populated dynamically -->
        </div>
    </div>

    <!-- Add Participants Modal -->
    <div id="add-participants-modal" class="modal-backdrop hidden">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold">Add Participants</h2>
                <button onclick="closeAddParticipantsModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="add-participants-form" class="space-y-4">
                <input type="hidden" id="event-id-for-participants">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Select Participants</label>
                    <select id="add-participants-select" multiple class="participants-select mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        <!-- Options will be populated via AJAX -->
                    </select>
                </div>

                <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Add Participants
                </button>
            </form>
        </div>
    </div>

    <script>
        let calendar;
        let currentEvent = null;
        let currentView = 'dayGridMonth';
        let users = []; // For participants selection
        
        // Check if user is admin
        const isAdmin = {{ 'true' if current_user.is_admin else 'false' }};
        
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize select2 for participants selectors
            $('.participants-select').select2({
                placeholder: 'Select participants',
                width: '100%'
            });
            
            // Load users for participant selection
            loadUsers();
            
            // Initialize the calendar
            initializeCalendar();
            
            // Add event listeners
            initializeEventListeners();
        });
        
        function initializeCalendar() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                height: 'auto',
                headerToolbar: false, // We're implementing our own custom header
                events: '/calendar/events',
                editable: isAdmin, // Only admins can drag/resize events
                selectable: true,
                selectMirror: true,
                dayMaxEvents: true,
                select: function(info) {
                    handleDateSelect(info);
                },
                eventClick: function(info) {
                    handleEventClick(info.event);
                },
                eventDrop: function(info) {
                    if (isAdmin) {
                        handleEventDrop(info.event);
                    }
                },
                eventResize: function(info) {
                    if (isAdmin) {
                        handleEventResize(info.event);
                    }
                },
                datesSet: function(info) {
                    updateTitleDate(info.view);
                },
                eventClassNames: function(info) {
                    // Add special class based on event type
                    if (info.event.extendedProps.type === 'zoom') {
                        return ['zoom-event'];
                    } else if (info.event.extendedProps.type === 'personal') {
                        return ['personal-event'];
                    } else {
                        return ['task-event'];
                    }
                }
            });
            calendar.render();
        }
        
        function initializeEventListeners() {
            // View buttons
            document.getElementById('month-view').addEventListener('click', function() {
                changeView('dayGridMonth');
                updateViewButtons('month-view');
            });
            
            document.getElementById('week-view').addEventListener('click', function() {
                changeView('timeGridWeek');
                updateViewButtons('week-view');
            });
            
            document.getElementById('day-view').addEventListener('click', function() {
                changeView('timeGridDay');
                updateViewButtons('day-view');
            });
            
            // Navigation buttons
            document.getElementById('prev-button').addEventListener('click', function() {
                calendar.prev();
            });
            
            document.getElementById('next-button').addEventListener('click', function() {
                calendar.next();
            });
            
            document.getElementById('today-button').addEventListener('click', function() {
                calendar.today();
            });
            
            // Form submissions
            document.getElementById('task-form').addEventListener('submit', function(e) {
                e.preventDefault();
                createTask();
            });
            
            document.getElementById('zoom-form').addEventListener('submit', function(e) {
                e.preventDefault();
                createZoomMeeting();
            });
            
            document.getElementById('add-participants-form').addEventListener('submit', function(e) {
                e.preventDefault();
                addParticipants();
            });
        }
        
        function loadUsers() {
    // Используем либо /calendar/users, либо /calendar/available-users в зависимости от того, 
    // какой эндпоинт вы решили оставить в бэкенде
    fetch('/calendar/users')
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! Status: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            users = data;
            
            // Populate both select dropdowns
            const zoomParticipants = document.getElementById('zoom-participants');
            const addParticipantsSelect = document.getElementById('add-participants-select');
            
            // Clear existing options
            zoomParticipants.innerHTML = '';
            addParticipantsSelect.innerHTML = '';
            
            // Add options
            users.forEach(user => {
                const option1 = document.createElement('option');
                option1.value = user.id;
                option1.textContent = user.username;  // Используем username вместо name
                zoomParticipants.appendChild(option1);
                
                const option2 = document.createElement('option');
                option2.value = user.id;
                option2.textContent = user.username;  // Используем username вместо name
                addParticipantsSelect.appendChild(option2);
            });
            
            // Refresh select2
            $('#zoom-participants').select2({
                placeholder: 'Select participants',
                width: '100%'
            });
            
            $('#add-participants-select').select2({
                placeholder: 'Select participants',
                width: '100%'
            });
        })
        .catch(error => {
            console.error('Error loading users:', error);
            showToast('Error loading users', true);
        });
}
        function updateViewButtons(activeButtonId) {
            // Reset all buttons
            document.getElementById('month-view').className = 'bg-red-100 text-red-500 px-4 py-2 hover:bg-red-200';
            document.getElementById('week-view').className = 'bg-red-100 text-red-500 px-4 py-2 hover:bg-red-200';
            document.getElementById('day-view').className = 'bg-red-100 text-red-500 px-4 py-2 hover:bg-red-200';
            
            // Add rounded corners appropriately
            document.getElementById('month-view').classList.add('rounded-l-md');
            document.getElementById('day-view').classList.add('rounded-r-md');
            
            // Set active button
            document.getElementById(activeButtonId).className = 'bg-red-500 text-white px-4 py-2 hover:bg-red-600';
            
            // Re-add rounded corners to active button if needed
            if (activeButtonId === 'month-view') {
                document.getElementById('month-view').classList.add('rounded-l-md');
            } else if (activeButtonId === 'day-view') {
                document.getElementById('day-view').classList.add('rounded-r-md');
            }
        }

        function changeView(viewName) {
            currentView = viewName;
            calendar.changeView(viewName);
        }

        function updateTitleDate(view) {
            const title = document.getElementById('current-date-title');
            const dateFormat = { 
                year: 'numeric', 
                month: 'long',
                day: view.type === 'timeGridDay' ? 'numeric' : undefined
            };
            
            if (view.type === 'timeGridWeek') {
                const start = calendar.view.activeStart;
                const end = calendar.view.activeEnd;
                const startDate = start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                const endDate = new Date(end.getTime() - 86400000).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                title.textContent = `${startDate} - ${endDate}`;
            } else {
                title.textContent = calendar.view.title;
            }
        }

        function toggleForm(type) {
            if (type === 'close') {
                document.getElementById('task-form-container').classList.add('hidden');
                document.getElementById('zoom-form-container').classList.add('hidden');
                return;
            }
            
            document.getElementById('task-form-container').classList.add('hidden');
            document.getElementById('zoom-form-container').classList.add('hidden');
            
            if (type === 'task') {
                document.getElementById('task-form-container').classList.remove('hidden');
            } else if (type === 'zoom') {
                document.getElementById('zoom-form-container').classList.remove('hidden');
            }
        }

        function handleDateSelect(info) {
            document.getElementById('task-start-date').value = info.startStr;
            document.getElementById('task-start-time').value = '09:00';
            
            if (isAdmin) {
                document.getElementById('zoom-start-date').value = info.startStr;
                document.getElementById('zoom-start-time').value = '09:00';
            }
            
            toggleForm('task');
        }

        function handleEventClick(event) {
            currentEvent = event;
            showEventDetails(event);
        }

        function handleEventDrop(event) {
            updateEvent(event);
        }
        
        function handleEventResize(event) {
            updateEvent(event);
        }

        function createTask() {
            const startDate = document.getElementById('task-start-date').value;
            const startTime = document.getElementById('task-start-time').value;
            const start = startTime ? `${startDate}T${startTime}` : startDate;

            const taskData = {
                title: document.getElementById('task-title').value,
                start: start,
                description: document.getElementById('task-description').value,
                color: document.getElementById('task-color').value,
                allDay: document.getElementById('task-all-day').checked
            };

            fetch('/calendar/task', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(taskData)
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(errorData => {
                        throw new Error(errorData.error || 'Unknown error');
                    });
                }
                return response.json();
            })
            .then(data => {
                calendar.addEvent(data);
                showToast('Task created successfully');
                resetTaskForm();
                toggleForm('close');
            })
            .catch(error => {
                console.error('Error:', error);
                showToast(`Error creating task: ${error.message}`, true);
            });
        }

        function createZoomMeeting() {
            const startDate = document.getElementById('zoom-start-date').value;
            const startTime = document.getElementById('zoom-start-time').value;
            
            // Get selected participants
            const participants = Array.from(document.getElementById('zoom-participants').selectedOptions).map(option => option.value);
            
            const meetingData = {
                topic: document.getElementById('zoom-topic').value,
                start_time: `${startDate}T${startTime}:00Z`,
                duration: document.getElementById('zoom-duration').value,
                agenda: document.getElementById('zoom-agenda').value,
                auto_record: document.getElementById('zoom-auto-record').checked,
                participants: participants
            };

            fetch('/calendar/meeting', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(meetingData)
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(errorData => {
                        throw new Error(errorData.error || 'Unknown error');
                    });
                }
                return response.json();
            })
            .then(data => {
                calendar.addEvent(data.event);
                showToast('Zoom meeting created successfully');
                resetZoomForm();
                toggleForm('close');
            })
            .catch(error => {
                console.error('Error:', error);
                showToast(`Error creating meeting: ${error.message}`, true);
            });
        }

        function showEventDetails(event) {
            const eventModal = document.getElementById('event-modal-container');
            const modalContent = document.getElementById('event-modal-content');
            
            const eventType = event.extendedProps.type || 'task';
            const isZoomEvent = eventType === 'zoom';
            const isRecorded = event.extendedProps.is_recorded;
            const recordingUrl = event.extendedProps.recording_url;
            const hasRecordings = isRecorded && recordingUrl;
            
            // Create buttons based on event type and user permissions
            let buttonsHtml = `
                <button onclick="closeEventDetails()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400">
                    Close
                </button>
            `;
            
            // Only creator and admin can delete events
            const creatorId = event.extendedProps.creator_id;
            const currentUserId = {{ current_user.id }};
            if (creatorId === currentUserId || isAdmin) {
                buttonsHtml = `
                    <button onclick="deleteEvent()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 mr-2">Delete</button>
                    <button onclick="closeEventDetails()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400">Close</button>
                `;
            }
            
            // Admin can get host URL and add participants to Zoom events
            if (isAdmin && isZoomEvent) {
                buttonsHtml = `
                    <button onclick="getHostUrl()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 mr-2">Get Host URL</button>
                    <button onclick="showAddParticipantsModal()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 mr-2">Add Participants</button>
                    <button onclick="deleteEvent()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 mr-2">Delete</button>
                    <button onclick="closeEventDetails()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400">Close</button>
                `;
            }
            
            // Create participants list
            let participantsHtml = '';
            if (event.extendedProps.participants && event.extendedProps.participants.length > 0) {
                participantsHtml = `
                    <div class="mt-4">
                        <h4 class="font-medium text-gray-700">Participants:</h4>
                        <ul class="mt-2 pl-5 list-disc">
                            ${event.extendedProps.participants.map(user => `<li>${user.username}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
            
            // Create content with appropriate details based on event type
            const content = `
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold">${event.title}</h2>
                        <div>
                            ${isZoomEvent ? '<span class="badge-zoom mr-2">Zoom</span>' : ''}
                            ${eventType === 'personal' ? '<span class="badge-personal">Personal</span>' : ''}
                            ${hasRecordings ? '<span class="badge-recording ml-2">Recorded</span>' : ''}
                        </div>
                    </div>
                    <p class="mb-2"><strong>Start:</strong> ${event.start.toLocaleString()}</p>
                    ${event.end ? `<p class="mb-2"><strong>End:</strong> ${event.end.toLocaleString()}</p>` : ''}
                    ${event.extendedProps.description ? `<p class="mb-2"><strong>Description:</strong> ${event.extendedProps.description}</p>` : ''}
                    ${event.extendedProps.zoom_url ? `
                        <p class="mb-4"><strong>Zoom URL:</strong> <a href="${event.extendedProps.zoom_url}" target="_blank" class="text-blue-500 hover:text-blue-700">${event.extendedProps.zoom_url}</a></p>
                    ` : ''}
                    ${hasRecordings ? `
                        <p class="mb-4"><strong>Recording:</strong> <a href="${recordingUrl}" target="_blank" class="text-blue-500 hover:text-blue-700">View Recording</a></p>
                    ` : ''}
                    ${participantsHtml}
                    <div class="flex justify-end space-x-2 mt-4">
                        ${buttonsHtml}
                    </div>
                </div>
            `;
            
            modalContent.innerHTML = content;
            eventModal.classList.remove('hidden');
        }

        function closeEventDetails() {
            document.getElementById('event-modal-container').classList.add('hidden');
            currentEvent = null;
        }
        
        function showAddParticipantsModal() {
            if (!currentEvent) return;
            
            // Set the event ID for the form
            document.getElementById('event-id-for-participants').value = currentEvent.id;
            
            // Pre-select existing participants if any
            const select = document.getElementById('add-participants-select');
            $(select).val(null).trigger('change'); // Clear current selection
            
            if (currentEvent.extendedProps.participants && currentEvent.extendedProps.participants.length > 0) {
                const participantIds = currentEvent.extendedProps.participants.map(user => user.id);
                $(select).val(participantIds).trigger('change');
            }
            
            // Show the modal
            document.getElementById('add-participants-modal').classList.remove('hidden');
        }
        
        function closeAddParticipantsModal() {
            document.getElementById('add-participants-modal').classList.add('hidden');
        }
        
        function addParticipants() {
            const eventId = document.getElementById('event-id-for-participants').value;
            const participantIds = Array.from(document.getElementById('add-participants-select').selectedOptions).map(option => option.value);
            
            fetch(`/calendar/meeting/${eventId}/participants`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ participant_ids: participantIds })
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(errorData => {
                        throw new Error(errorData.error || 'Unknown error');
                    });
                }
                return response.json();
            })
            .then(data => {
                showToast('Participants added successfully');
                closeAddParticipantsModal();
                closeEventDetails();
                calendar.refetchEvents(); // Refresh to get updated participants
            })
            .catch(error => {
                console.error('Error:', error);
                showToast(`Error adding participants: ${error.message}`, true);
            });
        }
        
        function getHostUrl() {
            if (!currentEvent) return;
            
            fetch(`/calendar/meeting/${currentEvent.id}/host-url`)
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(errorData => {
                            throw new Error(errorData.error || 'Unknown error');
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.host_url) {
                        // Show host URL in a temporary element
                        const hostUrlDiv = document.createElement('div');
                        hostUrlDiv.className = 'mt-4 p-4 bg-blue-50 border border-blue-200 rounded';
                        hostUrlDiv.innerHTML = `
                            <p class="font-medium">Host URL (with admin privileges):</p>
                            <p class="mt-2 break-all text-blue-600">
                                <a href="${data.host_url}" target="_blank">${data.host_url}</a>
                            </p>
                            <p class="mt-2 text-sm text-gray-500">This URL provides host controls. Use it to start the meeting.</p>
                        `;
                        
                        document.getElementById('event-modal-content').appendChild(hostUrlDiv);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showToast(`Error getting host URL: ${error.message}`, true);
                });
        }

        function deleteEvent() {
            if (!currentEvent) return;

            if (confirm('Are you sure you want to delete this event?')) {
                fetch(`/calendar/event/${currentEvent.id}`, {
                    method: 'DELETE'
                })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(errorData => {
                            throw new Error(errorData.error || 'Unknown error');
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    currentEvent.remove();
                    showToast('Event deleted');
                    closeEventDetails();
                })
                .catch(error => {
                    console.error('Error:', error);
                    showToast(`Error deleting event: ${error.message}`, true);
                });
            }
        }

        function updateEvent(event) {
            const eventData = {
                start: event.start.toISOString(),
                end: event.end ? event.end.toISOString() : event.start.toISOString()
            };

            fetch(`/calendar/event/${event.id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(eventData)
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(errorData => {
                        throw new Error(errorData.error || 'Unknown error');
                    });
                }
                return response.json();
            })
            .then(data => {
                showToast('Event updated');
            })
            .catch(error => {
                console.error('Error:', error);
                showToast(`Error updating event: ${error.message}`, true);
                calendar.refetchEvents();
            });
        }

        function showToast(message, isError = false) {
            Toastify({
                text: message,
                duration: 3000,
                gravity: "top",
                position: "right",
                style: {
                    background: isError ? "#EF4444" : "#10B981"
                }
            }).showToast();
        }

        function resetTaskForm() {
            document.getElementById('task-form').reset();
        }

        function resetZoomForm() {
            document.getElementById('zoom-form').reset();
            $('#zoom-participants').val(null).trigger('change');
        }
    </script>
</body>
</html>
