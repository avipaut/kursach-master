<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация | LMS-Система</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .main-container {
            width: 900px;
            max-width: 90%;
            height: 550px;
            max-height: 90vh;
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
        }
        .brand-side {
            background-color: #f8f9fa;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        }
        .brand-logo {
            max-width: 250px;
            margin-bottom: 20px;
        }
        .brand-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-top: 15px;
        }
        .form-side {
            background-color: white;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }
        .auth-form {
            width: 100%;
            max-width: 320px;
        }
        .auth-form h1 {
            color: #333;
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-label {
            font-weight: 500;
            margin-bottom: 5px;
        }
        .form-control {
            height: 45px;
            border-radius: 8px;
            border: 1px solid #ced4da;
        }
        .btn-auth {
            width: 100%;
            background-color: #c9121e;
            border: none;
            height: 45px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-auth:hover {
            background-color: #a30f19;
        }
        .form-switch {
            margin-top: 20px;
            text-align: center;
        }
        .form-switch a {
            color: #c9121e;
            text-decoration: none;
            font-weight: 500;
        }
        .form-switch a:hover {
            text-decoration: underline;
        }
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                height: auto;
            }
            .brand-side {
                padding: 20px;
            }
            .form-side {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Left Side - Brand -->
        <div class="brand-side">
            <img src="{{ url_for('static', filename='uploads/auth/logo.png') }}" alt="LMS-Система" class="brand-logo">
            <div class="brand-title">LMS-Система</div>
        </div>
        
        <!-- Right Side - Form -->
        <div class="form-side">
            <div class="auth-form">
                <h1>Вход в систему</h1>
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                
                <form method="POST">
                    <div class="form-group">
                        <label class="form-label">Логин или Email:</label>
                        <input type="text" name="username" class="form-control" placeholder="Введите логин или email" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Пароль sadsd:</label>
                        <input type="password" name="password" class="form-control" placeholder="Введите пароль" required>
                    </div>
                    
                    <button type="submit" class="btn btn-auth btn-lg text-white">Войти</button>
                </form>
                
                <!-- <div class="form-switch">
                    Нет аккаунта? <a href="{{ url_for('auth.register') }}">Зарегистрироваться</a>
                </div> -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-hide flash messages after 5 seconds
        setTimeout(function() {
            var flashMessages = document.querySelectorAll('.alert');
            flashMessages.forEach(function(message) {
                message.style.opacity = '0';
                message.style.transition = 'opacity 0.5s';
                setTimeout(function() {
                    message.style.display = 'none';
                }, 500);
            });
        }, 5000);
    </script>
</body>
</html>
